<meta charset="UTF-8">

<title>Custom Tags Plus — Laser Engraved Livestock Ear Tags</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap">

<style>
/* === CORE BRAND === */
:root{
  --brand-dark:#1a1208;
  --brand-brown:#5c3d0e;
  --brand-gold:#c8860a;
  --brand-gold-light:#e8a82c;
  --brand-cream:#fdf6e9;
  --brand-tan:#f0ddb5;
  --brand-text:#2b1d06;
  --brand-muted:#7a5c2e;
  --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--brand-cream);color:var(--brand-text)}

/* Header, Tabs, Pages, etc. */
/* (unchanged — your site logic remains intact) */

/* === ADMIN ANALYTICS PANEL === */
.analytics-panel{
  display:none;
  margin-top:2.5rem;
  padding:1.6rem;
  background:rgba(200,134,10,0.06);
  border:1px solid rgba(200,134,10,0.35);
  border-radius:12px;
}
.analytics-title{
  font-family:'Playfair Display',serif;
  color:var(--brand-gold-light);
  font-size:1.4rem;
  margin-bottom:.6rem;
}
.analytics-desc{
  color:#aaa;
  font-size:.85rem;
  margin-bottom:1rem;
}
.analytics-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.analytics-btn{
  background:var(--brand-gold);
  color:var(--brand-dark);
  border:none;
  border-radius:999px;
  padding:8px 14px;
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
}
.analytics-btn:hover{background:var(--brand-gold-light)}
</style>
</head>

<body>

<!-- HEADER / NAV / STORE / CONTACT / SETUP -->
<!-- Your existing markup stays unchanged -->

<!-- ✅ SETUP PAGE — ADD THIS INSIDE setup-inner -->
<div class="analytics-panel" id="admin-analytics">
  <div class="analytics-title">📊 Site Analytics</div>
  <div class="analytics-desc">
    Traffic sources, devices, locations, and daily unique visitors.
    (Visible to admins only.)
  </div>

  <div class="analytics-actions">
    <a class="analytics-btn" id="ga-dashboard" target="_blank">GA Dashboard</a>
    <a class="analytics-btn" id="ga-acquisition" target="_blank">Traffic Sources</a>
    <a class="analytics-btn" id="ga-geo" target="_blank">Locations</a>
    <a class="analytics-btn" id="ga-devices" target="_blank">Devices</a>
  </div>
</div>

<footer id="footer-trigger">
  © <span id="year"></span> <span>Custom Tags Plus</span>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* === GA4 PROPERTY ID (CHANGE THIS) === */
const GA_PROPERTY_ID = '486403819';

/* === ADMIN STATE === */
let isAdmin = sessionStorage.getItem('ctp_admin') === '1';

function applyAdminState(){
  const panel=document.getElementById('admin-analytics');
  if(isAdmin){
    panel.style.display='block';
  }else{
    panel.style.display='none';
  }
}
applyAdminState();

/* === ADMIN ANALYTICS LINKS === */
function initAnalyticsLinks(){
  const base=`https://analytics.google.com/analytics/web/#/p${GA_PROPERTY_ID}`;

  document.getElementById('ga-dashboard').href = base + '/reports/intelligenthome';
  document.getElementById('ga-acquisition').href= base + '/reports/acquisition-traffic';
  document.getElementById('ga-geo').href= base + '/reports/demographics-geographic';
  document.getElementById('ga-devices').href= base + '/reports/tech-details';
}
initAnalyticsLinks();

/* === ADMIN UNLOCK (footer 5 clicks) === */
let clicks=0,t;
document.getElementById('footer-trigger').onclick=()=>{
  clicks++;
  clearTimeout(t);
  t=setTimeout(()=>clicks=0,1500);
  if(clicks>=5){
    clicks=0;
    isAdmin=true;
    sessionStorage.setItem('ctp_admin','1');
    applyAdminState();
    // show setup tab (existing function)
    if(typeof showTab==='function') showTab('setup');
  }
};
</script>

</body>
</html>
